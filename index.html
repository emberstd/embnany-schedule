<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmiBonnie &amp; Any</title>
    <meta
      name="description"
      content="EmiBonnie &amp; Any — Schedule and Dashboard"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --foreground: #ffffff;
        --font-portal-serif: "New York", "New York Small", "Iowan Old Style",
          "Apple Garamond", "Palatino Linotype", Palatino, Georgia,
          "Times New Roman", serif;
        --font-portal-display: "Orbitron", "Audiowide", "Michroma", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        color: var(--foreground);
        background-color: #1a0a2e;
        font-family: var(--font-portal-serif);
        font-feature-settings: "liga" 1, "kern" 1;
        -webkit-font-smoothing: antialiased;
      }

      .bg-layer {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        background:
          radial-gradient(ellipse 80% 60% at 50% 0%, rgba(120, 60, 200, 0.35), transparent),
          radial-gradient(ellipse 60% 50% at 80% 100%, rgba(80, 40, 160, 0.25), transparent),
          #1a0a2e;
      }

      .bg-layer video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.55;
      }

      .bg-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
      }

      main {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        padding: 4rem 1.5rem;
      }

      .portal-shell {
        display: flex;
        width: 100%;
        max-width: min(100%, 20rem);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin-top: 45px;
        font-family: var(--font-portal-display);
      }

      .portal-header {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .portal-brand {
        display: grid;
        justify-items: center;
        margin: 0;
        row-gap: clamp(0.55rem, 3vw, 1rem);
        font-family: var(--font-portal-display);
        text-transform: uppercase;
      }

      .portal-brand-word {
        display: block;
        font-size: clamp(2.35rem, 10.5vw, 3.85rem);
        font-weight: 800;
        line-height: 0.78;
        letter-spacing: 0.1em;
        background: linear-gradient(
          180deg,
          #e4feff 0%,
          #ffffff 38%,
          #ddd6ff 72%,
          #b8a8ff 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter:
          drop-shadow(0 0 14px rgba(56, 220, 255, 0.22))
          drop-shadow(0 0 28px rgba(168, 120, 255, 0.12))
          drop-shadow(3px 4px 10px rgba(0, 0, 0, 0.68));
      }

      .portal-brand-word-top {
        margin: 0;
      }

      .portal-brand-word-bottom {
        position: relative;
        top: -55px;
        left: 5px;
        margin: 0;
      }

      .portal-brand-amp {
        position: relative;
        z-index: 2;
        display: block;
        margin: 0;
        align-self: center;
        top: -32px;
        left: 13px;
        font-size: clamp(1.2rem, 4.8vw, 1.85rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.06em;
        color: #fff8f0;
        text-shadow:
          0 0 8px rgba(255, 168, 48, 1),
          0 0 18px rgba(255, 120, 24, 0.9),
          0 0 28px rgba(255, 64, 180, 0.35),
          0 0 34px rgba(255, 88, 16, 0.55),
          0 2px 6px rgba(0, 0, 0, 0.55);
      }

      .portal-nav {
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .portal-glass-card {
        position: relative;
        display: flex;
        width: 100%;
        max-width: 15.5rem;
        min-height: 3.75rem;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        padding: 1rem 1.5rem;
        text-decoration: none;
        color: inherit;
        background: rgba(255, 255, 255, 0.14);
        -webkit-backdrop-filter: blur(44px) saturate(195%);
        backdrop-filter: blur(44px) saturate(195%);
        border: 1px solid rgba(255, 255, 255, 0.36);
        box-shadow:
          0 12px 48px rgba(0, 0, 0, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.55),
          inset 0 -1px 0 rgba(255, 255, 255, 0.06);
        transition:
          background 0.28s ease,
          border-color 0.28s ease,
          box-shadow 0.28s ease,
          transform 0.2s ease;
      }

      .portal-glass-card-icon {
        position: absolute;
        left: 1.25rem;
        top: 50%;
        height: 1.375rem;
        width: 1.375rem;
        transform: translateY(-50%);
        object-fit: contain;
        opacity: 0.92;
        filter: brightness(0) invert(1);
      }

      .portal-glass-card-label {
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        background: linear-gradient(
          180deg,
          #e4feff 0%,
          #ffffff 45%,
          #d8d0ff 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 10px rgba(56, 220, 255, 0.18));
        transition: filter 0.28s ease;
      }

      @media (min-width: 768px) {
        .portal-glass-card {
          min-height: 4rem;
          max-width: 16.5rem;
        }

        .portal-glass-card-label {
          font-size: 0.875rem;
          letter-spacing: 0.24em;
        }
      }

      .portal-glass-card:hover {
        background: rgba(255, 255, 255, 0.24);
        border-color: rgba(255, 255, 255, 0.52);
        box-shadow:
          0 16px 56px rgba(0, 0, 0, 0.26),
          inset 0 1px 0 rgba(255, 255, 255, 0.68),
          0 0 40px rgba(180, 120, 255, 0.12);
        transform: translateY(-2px);
      }

      .portal-glass-card:hover .portal-glass-card-label {
        filter:
          drop-shadow(0 0 12px rgba(56, 220, 255, 0.35))
          drop-shadow(0 0 20px rgba(168, 100, 255, 0.2));
      }

      .portal-glass-card:active {
        transform: translateY(0) scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true">
      <video autoplay muted loop playsinline preload="auto">
        <source src="/background.mp4" type="video/mp4" />
      </video>
      <div class="bg-overlay"></div>
    </div>

    <main>
      <div class="portal-shell">
        <header class="portal-header">
          <h1 class="portal-brand" aria-label="EmiBonnie and Any">
            <span class="portal-brand-word portal-brand-word-top">EMIBONNIE</span>
            <span class="portal-brand-amp" aria-hidden="true">&amp;</span>
            <span class="portal-brand-word portal-brand-word-bottom">ANY</span>
          </h1>
        </header>

        <nav class="portal-nav" aria-label="Modules">
          <a class="portal-glass-card" href="/schedule">
            <img
              class="portal-glass-card-icon"
              src="/icons/schedule-megaphone.png?v=1"
              alt=""
              width="22"
              height="22"
              aria-hidden="true"
            />
            <span class="portal-glass-card-label">Schedule</span>
          </a>
          <a class="portal-glass-card" href="/dashboard">
            <img
              class="portal-glass-card-icon"
              src="/icons/dashboard-chart.png?v=1"
              alt=""
              width="22"
              height="22"
              aria-hidden="true"
            />
            <span class="portal-glass-card-label">Dashboard</span>
          </a>
        </nav>
      </div>
    </main>
  </body>
</html>
